name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Fix all image and asset paths in output
        run: |
          # Fix image src attributes in all files
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's|"\(/[^v"]*\.jpg\)"|"/viratsbuildtech\1"|g' {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's|"\(/[^v"]*\.png\)"|"/viratsbuildtech\1"|g' {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's|"\(/[^v"]*\.svg\)"|"/viratsbuildtech\1"|g' {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's|"\(/[^v"]*\.webp\)"|"/viratsbuildtech\1"|g' {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|'\\(/[^v']*\\.jpg\\)'|'/viratsbuildtech\\1'|g" {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|'\\(/[^v']*\\.png\\)'|'/viratsbuildtech\\1'|g" {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|'\\(/[^v']*\\.svg\\)'|'/viratsbuildtech\\1'|g" {} +
          find out -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" \) -exec sed -i "s|'\\(/[^v']*\\.webp\\)'|'/viratsbuildtech\\1'|g" {} +

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
